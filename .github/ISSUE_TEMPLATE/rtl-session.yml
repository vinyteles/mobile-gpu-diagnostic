name: RTL benchmark session
description: Register a public session and its hardware/configuration assignment.
title: "RTL session: configuration N / device"
body:
  - type: input
    id: repository
    attributes:
      label: Public Hugging Face dataset URL
    validations:
      required: true
  - type: dropdown
    id: configuration
    attributes:
      label: APK configuration
      options:
        - "1: Energy-Mobile mixed 4/8-bit · LiteRT-LM GPU"
        - "2: LFM3 Q4_K_M · Vulkan GPU"
        - "3: LFM3 mixed4 · LiteRT-LM GPU"
        - "4: Gemma 4 E2B-IT mixed 2/4/8-bit · LiteRT-LM GPU"
        - "5: Gemma 4 E2B-IT Q8_0 · Vulkan GPU, if RAM permits"
        - "6: LFM3 Q4_K_M · llama.cpp CPU"
        - "7: Energy-Mobile int8 · LiteRT-LM CPU"
        - "8: Energy-Mobile mixed 4/8-bit · LiteRT-LM CPU"
        - "9: Gemma 4 E2B-IT mixed 2/4/8-bit · LiteRT-LM CPU"
        - "10: Energy-Mobile int8 RL · LiteRT-LM GPU"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone, SoC, RAM, and Android version
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Session status / notes
      description: Include run IDs and interruptions when relevant. Do not paste access tokens.
